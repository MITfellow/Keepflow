  <style>
    .sub-hero { padding: 96px 24px 56px; text-align: center; background: var(--kf-paper, #FAFAF8); border-bottom: 1px solid rgba(20,24,31,.08); }
    .sub-hero .eyebrow { display:inline-block; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--keep-blue-bright); margin-bottom:14px; }
    .sub-hero h1 { font-family:"Plus Jakarta Sans",sans-serif; font-size:clamp(34px,5vw,52px); letter-spacing:-.03em; margin:0 0 14px; }
    .sub-hero p { max-width:720px; margin:0 auto; color:var(--text-secondary); font-size:17px; line-height:1.65; }
    .page-section { max-width:1040px; margin:0 auto; padding:56px 24px; }
    .grid-2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; margin-top:22px; }
    .card { background:#fff; border:1px solid rgba(0,0,0,.07); border-radius:18px; padding:22px; box-shadow:var(--shadow-soft); }
    .card h3 { font-family:"Plus Jakarta Sans",sans-serif; font-size:18px; margin:0 0 8px; }
    .card p, .card li { color:var(--text-secondary); font-size:14.5px; line-height:1.65; }
    .label { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:#5b6472; background:#f3f5f8; border-radius:999px; padding:4px 8px; margin-bottom:10px; }
    .card ul { margin:10px 0 0 18px; display:grid; gap:6px; }
    .note { margin-top:18px; padding:14px 16px; border-radius:14px; background:#fff8e8; border:1px solid rgba(180,120,0,.18); color:#5f4700; font-size:13.5px; }
    .cta-band { margin:8px 24px 72px; max-width:1040px; margin-left:auto; margin-right:auto; background:#0a0a0a; color:#fff; border-radius:22px; padding:28px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .cta-band h2 { font-family:"Plus Jakarta Sans",sans-serif; font-size:24px; margin:0 0 4px; }
    .cta-band p { margin:0; color:rgba(255,255,255,.72); }
    @media (max-width:860px){ .grid-2 { grid-template-columns:1fr; } }
  </style>
