  <style>
    .sub-hero { padding: 96px 24px 56px; text-align: center; background: var(--kf-paper, #FAFAF8); border-bottom: 1px solid rgba(20,24,31,.08); }
    .sub-hero .eyebrow { display:inline-block; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--keep-blue-bright); margin-bottom:14px; }
    .sub-hero h1 { font-family:"Plus Jakarta Sans",sans-serif; font-size:clamp(34px,5vw,52px); letter-spacing:-.03em; margin:0 0 14px; }
    .sub-hero p { max-width:720px; margin:0 auto; color:var(--text-secondary); font-size:17px; line-height:1.65; }
    .page-section { max-width:920px; margin:0 auto; padding:56px 24px 80px; }
    .empty { background:#fff; border:1px solid rgba(0,0,0,.07); border-radius:22px; padding:32px 28px; box-shadow:var(--shadow-soft); text-align:center; }
    .empty h2 { font-family:"Plus Jakarta Sans",sans-serif; margin:0 0 10px; font-size:26px; }
    .empty p { margin:0 auto; max-width:620px; color:var(--text-secondary); line-height:1.7; }
    .topics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-top:22px; text-align:left; }
    .topic { background:#f7f9fc; border:1px solid rgba(0,0,0,.05); border-radius:14px; padding:14px 15px; }
    .topic strong { display:block; font-size:14px; margin-bottom:4px; }
    .topic span { color:var(--text-secondary); font-size:13.5px; line-height:1.55; }
    @media (max-width:860px){ .topics { grid-template-columns:1fr; } }
  </style>
