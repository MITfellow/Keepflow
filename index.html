<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F7F5" />
    <meta name="color-scheme" content="light dark" />
    <title>KeepFlow — Your day, quietly handled</title>
    <meta name="description" content="KeepFlow is your personal AI agent that helps plan, research, draft, and complete everyday work with your review and permission." />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('keepflow-theme');
          var theme = saved === 'dark' || saved === 'light' ? saved : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0B0C0E' : '#F7F7F5');
        } catch (e) {}
      })();
    </script>
