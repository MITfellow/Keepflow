  <script>
  const SUPABASE_URL = 'https://tppsxyfsovlawijtnbeq.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_rXXTukON2FEGbyuSeMgAig_0PdN2Ku7';
  const SUPABASE_WAITLIST_TABLE = 'waitlist';
  const supabaseClient = (window.supabase && SUPABASE_URL && SUPABASE_PUBLISHABLE_KEY)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;

  async function submitWaitlistToSupabase(payload) {
    if (!supabaseClient) return { ok: false, error: { message: 'Waitlist is not configured.' } };
    const { error } = await supabaseClient.from(SUPABASE_WAITLIST_TABLE).insert([payload]);
    if (!error) return { ok: true };
    const msg = (error.message || '').toLowerCase();
    const code = String(error.code || '');
    if (code === '23505' || msg.includes('duplicate') || msg.includes('unique') || msg.includes('already')) {
      return { ok: true, duplicate: true };
    }
    return { ok: false, error };
  }

  async function handleInlineWaitlist(e, source) {
    e.preventDefault();
    const form = e.currentTarget;
    const btn = form.querySelector('button[type="submit"]');
    const email = (form.querySelector('input[type="email"]')?.value || '').trim().toLowerCase();
    if (!email) return;
    if (btn) { btn.disabled = true; btn.dataset.label = btn.textContent; btn.textContent = 'Saving...'; }
    const payload = { email, source: source || 'site', page: location.pathname + location.hash };
    const result = await submitWaitlistToSupabase(payload);
    if (btn) { btn.disabled = false; btn.textContent = btn.dataset.label || 'Join waitlist'; }
    if (!result.ok) { alert((result.error && result.error.message) || 'Could not save your spot right now.'); return; }
    form.style.display = 'none';
    const banner = document.getElementById('bottomWaitlistSuccess');
    const text = document.getElementById('bottomSuccessText');
    if (text) text.textContent = result.duplicate
      ? `You're already on the list, ${email}. We'll be in touch.`
      : `You're on the KeepFlow waitlist, ${email}. We'll email you when your spot is ready.`;
    if (banner) banner.style.display = 'block';
  }
</script>
